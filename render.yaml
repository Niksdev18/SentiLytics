services:
  - type: web
    name: sentilytics
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT --timeout 120 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEMO_MODE
        value: "false"
      - key: START_SCHEDULER
        value: "true"
      - key: TINYFISH_API_KEY
        sync: false
      - key: NEWS_PROVIDER
        value: "tinyfish"
      - key: NEWSAPI_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

